spring:
  application:
    name: vehicle-service

---
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mmv-db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update

  boot:
    admin:
      client:
        url: http://localhost:9090

  redis:
    host: ec2-13-201-22-81.ap-south-1.compute.amazonaws.com
    port: 6379

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: "*"


  endpoint:
    health:
      show-details: always